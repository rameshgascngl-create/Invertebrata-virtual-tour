name: INVERTEBRATA v1.8.7 Canonical Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANONICAL_ZIP: INVERTEBRATA_v1.8.7_RECONCILED_ANDROID_SOURCE.zip
      CANONICAL_ZIP_SHA256: 281e5f80a14f80df6ad87427a8e29859050f35430ec3158ad52b84ae607df1a3
      R2_ZIP_SHA256: 3f3ffd5d0b03da74b9f7b85cfc755883594aea3141149b1131ee11963d9a184a
      CANONICAL_PAYLOAD_SHA256: 25220886837b724f781612f66ae5f8fd4a983ca644559c4871aff91b479e24b7
      CANONICAL_LAUNCHER_SHA256: dbd00a8d0e8ce09574c9c730b5fb4fa0049b3470171204c6db4712184bb54f7e
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify frozen ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CANONICAL_ZIP"
          actual="$(sha256sum "$CANONICAL_ZIP" | awk '{print $1}')"
          echo "Frozen ZIP SHA-256: $actual"
          test "$actual" = "$CANONICAL_ZIP_SHA256"

      - name: Extract frozen source
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$CANONICAL_ZIP" -d "$RUNNER_TEMP/src"
          settings="$(find "$RUNNER_TEMP/src" -type f -name settings.gradle -print -quit)"
          test -n "$settings"
          root="$(dirname "$settings")"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Verify frozen payload and launcher
        shell: bash
        working-directory: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          test "$(sha256sum academic_payload/index.html | awk '{print $1}')" = "$CANONICAL_PAYLOAD_SHA256"
          test "$(sha256sum app/src/main/assets/www/index.html | awk '{print $1}')" = "$CANONICAL_PAYLOAD_SHA256"
          test "$(sha256sum launcher_assets/master/invertebrata_icon_master.png | awk '{print $1}')" = "$CANONICAL_LAUNCHER_SHA256"

      - name: Derive reconciled R2 Android shell source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/INVERTEBRATA_v1.8.7_RECONCILED_ANDROID_SOURCE_R2.zip"
          python "$GITHUB_WORKSPACE/ci/reconcile_r2.py" "${{ steps.extract.outputs.root }}" "$out"
          actual="$(sha256sum "$out" | awk '{print $1}')"
          echo "R2 ZIP SHA-256: $actual"
          test "$actual" = "$R2_ZIP_SHA256"
          cd "${{ steps.extract.outputs.root }}"
          sha256sum -c provenance/SOURCE_MANIFEST_SHA256.txt
          test "$(sha256sum academic_payload/index.html | awk '{print $1}')" = "$CANONICAL_PAYLOAD_SHA256"
          test "$(sha256sum app/src/main/assets/www/index.html | awk '{print $1}')" = "$CANONICAL_PAYLOAD_SHA256"
          test "$(sha256sum launcher_assets/master/invertebrata_icon_master.png | awk '{print $1}')" = "$CANONICAL_LAUNCHER_SHA256"
          mkdir -p "$RUNNER_TEMP/evidence"
          printf '%s  %s\n' "$actual" "INVERTEBRATA_v1.8.7_RECONCILED_ANDROID_SOURCE_R2.zip" > "$RUNNER_TEMP/evidence/r2-source-sha256.txt"

      - name: Upload reconciled R2 source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.7-R2-reconciled-source
          path: ${{ runner.temp }}/INVERTEBRATA_v1.8.7_RECONCILED_ANDROID_SOURCE_R2.zip
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ""

      - name: Install Android 36 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: "8.14.3"
          cache-read-only: true

      - name: Restore official Gradle wrapper
        shell: bash
        working-directory: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build without suppressing checks
        shell: bash
        working-directory: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean lint test assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Capture lint evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence/lint"
          root="${{ steps.extract.outputs.root }}"
          if [ -d "$root/app/build" ]; then
            find "$root/app/build" -type f \( -name 'lint-results*.txt' -o -name 'lint-results*.html' -o -name 'lint-results*.xml' -o -name 'lint-results*.sarif' \) -print -exec cp {} "$RUNNER_TEMP/evidence/lint/" \; || true
          fi
          if [ -d "$root/build/reports/problems" ]; then
            cp -R "$root/build/reports/problems" "$RUNNER_TEMP/evidence/" || true
          fi

      - name: Record artifact hashes
        if: success()
        shell: bash
        working-directory: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum | tee "$RUNNER_TEMP/evidence/artifact-sha256.txt"
          sha256sum academic_payload/index.html app/src/main/assets/www/index.html launcher_assets/master/invertebrata_icon_master.png | tee "$RUNNER_TEMP/evidence/source-sha256.txt"

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.7-R2-build-outputs
          path: |
            ${{ steps.extract.outputs.root }}/app/build/outputs/apk/
            ${{ steps.extract.outputs.root }}/app/build/outputs/bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.7-R2-build-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
